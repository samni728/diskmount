name: DiskMount
options:
  bundleIdPrefix: com.samni
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  DiskMount:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Web
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samni.DiskMount
        PRODUCT_NAME: DiskMount
        ARCHS: arm64
        MARKETING_VERSION: 0.2.10
        CURRENT_PROJECT_VERSION: 16
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: samni728@gmail.com (4BVG532TG3)"
        DEVELOPMENT_TEAM: YU9NH29226
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  DiskMountTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DiskMount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samni.DiskMountTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: samni728@gmail.com (4BVG532TG3)"
        DEVELOPMENT_TEAM: YU9NH29226
